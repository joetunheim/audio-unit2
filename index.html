<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Englisch Unit 2 – Audio</title>
<style>
  :root { --bg:#f4f7fb; --card:#fff; --ink:#1d2433; --accent:#2563eb; --accent2:#16a34a; --muted:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  main { width:100%; max-width:520px; background:var(--card); border-radius:20px; padding:28px 22px;
         box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p  { color:var(--muted); margin:0 0 24px; font-size:1.05rem; }
  .choice { display:grid; gap:16px; }
  .choice button { font-size:1.6rem; font-weight:700; padding:28px 16px; border:0; border-radius:16px;
                   color:#fff; cursor:pointer; }
  .k5 { background:var(--accent); } .k6 { background:var(--accent2); }
  .controls { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:20px 0 8px; }
  .controls button { font-size:1.2rem; font-weight:600; padding:16px 20px; min-width:130px; border-radius:14px;
                     border:2px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; }
  .controls button.primary { background:var(--accent); color:#fff; }
  .time { font-variant-numeric:tabular-nums; font-size:1.1rem; color:var(--muted); }
  progress { width:100%; height:12px; margin-top:10px; accent-color:var(--accent); }
  .back { margin-top:26px; background:none; border:0; color:var(--muted); font-size:1rem; text-decoration:underline; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="select">
    <h1>Englisch · Unit 2</h1>
    <p>Wähle deine Klasse:</p>
    <div class="choice">
      <button class="k5" data-src="audio/klasse5-track05.mp3" data-label="5. Klasse">5. Klasse</button>
      <button class="k6" data-src="audio/klasse6-track03.mp3" data-label="6. Klasse">6. Klasse</button>
    </div>
  </section>

  <section id="player" hidden>
    <h1 id="title"></h1>
    <p>Unit 2 · Hörverstehen</p>
    <audio id="audio" preload="auto"></audio>
    <div class="controls">
      <button id="play" class="primary">▶ Play</button>
      <button id="pause">⏸ Pause</button>
      <button id="restart">⏮ Zum Anfang</button>
    </div>
    <progress id="bar" value="0" max="1"></progress>
    <div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div>
    <button class="back" id="back">← andere Klasse wählen</button>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const audio = $("audio");
  const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";

  document.querySelectorAll(".choice button").forEach(b => b.addEventListener("click", () => {
    audio.src = b.dataset.src;
    $("title").textContent = b.dataset.label;
    $("select").hidden = true;
    $("player").hidden = false;
  }));
  $("play").onclick = () => audio.play();
  $("pause").onclick = () => audio.pause();
  $("restart").onclick = () => { audio.pause(); audio.currentTime = 0; };
  $("back").onclick = () => {
    audio.pause(); audio.removeAttribute("src"); audio.load();
    $("player").hidden = true; $("select").hidden = false;
  };
  audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", () => {
    $("cur").textContent = fmt(audio.currentTime);
    $("bar").value = audio.duration ? audio.currentTime / audio.duration : 0;
  });
</script>
</body>
</html>
